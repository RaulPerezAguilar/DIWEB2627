<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 3</title>
</head>
<body>
    <!--
        CABECERA
        Conceptuales: se puede entender como un plano rectangular que ocupa la parte superior de la página.
        Visuales: el color principal de la marca podría identificar el fondo; el logo y la imagen aportan forma y textura.
        Relacionales: el título, el logo y la imagen se ordenarían y alinearían dentro del plano, dejando espacio entre ellos.
        Prácticos: presenta la tienda y su identidad para que el usuario reconozca dónde está.
    -->
    <header>
        <h1>Header de mi tienda</h1>
        <!-- baner o foto representativa de la tienda -->
         <img src="https://s2.dmcdn.net/v/AqIcD1VtLE4Ta7r8W/x720" alt="Foto de tienda de ropa">
        <!-- Logo de la tienda -->
         <img src="https://tse3.mm.bing.net/th/id/OIP.J11aJ4WL3L044Y5gpT9v2gAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Logo de la tienda">
    </header>
    <body>
        <!--
            BARRA LATERAL
            Conceptuales: sus enlaces y categorías pueden agruparse dentro de un plano vertical rectangular.
            Visuales: el contraste de color y el tamaño de los títulos permiten distinguir las categorías.
            Relacionales: su posición junto al contenido principal y la alineación de la lista muestran la jerarquía.
            Prácticos: permite localizar y abrir rápidamente una categoría de productos.
        -->
        <!-- barra lateral -->
         <sidebar>
            <h2>Barra lateral</h2>
            <ul>
                <li><a href="#">Categoría 1</a></li>
                <li><a href="#">Categoría 2</a></li>
                <li><a href="#">Categoría 3</a></li>
            </ul>
        </sidebar>
        <!--
            NAVEGACIÓN
            Conceptuales: puede representarse como una línea o franja horizontal que reúne los enlaces principales.
            Visuales: el color, el tamaño de los enlaces y sus estados de interacción hacen visible cada opción.
            Relacionales: el orden y la separación entre enlaces indican su relación y facilitan recorrerlos.
            Prácticos: ofrece accesos directos a Inicio, Productos y Contacto.
        -->
        <!-- menu de navegación -->
        <nav>
            <ul>
                <li><a href="#">Inicio</a></li>
                <li><a href="#">Productos</a></li>
                <li><a href="#">Contacto</a></li>
            </ul>
        </nav>
        <!--
            PIE DE PÁGINA
            Conceptuales: puede funcionar como un plano horizontal que cierra visualmente la página.
            Visuales: un fondo diferenciado y texto legible lo separan del resto del contenido.
            Relacionales: su posición al final y la alineación del texto indican que contiene información secundaria.
            Prácticos: comunica la titularidad y los derechos de la tienda.
        -->
        <!-- Pie de página -->
        <footer>
            <p>&copy; 2026 Mi Tienda. Todos los derechos reservados.</p>
        </footer>
    </body>
</body>
</html>
