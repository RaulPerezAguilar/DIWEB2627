<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tema 01 — Evolución de la Web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        :root {
            --background: #111;
            --surface: #181818;
            --surface-hover: #202020;

            --text: #e9e7e2;
            --secondary: #858585;

            --border: #2b2b2b;
            --border-hover: #454545;

            --accent: #b8b1a3;

            --max-width: 1180px;
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {
            background: var(--background);
            color: var(--text);

            font-family: "Inter", sans-serif;
        }


        a {
            color: inherit;
            text-decoration: none;
        }


        /* HEADER */

        header {
            border-bottom: 1px solid var(--border);
        }


        .nav {
            max-width: var(--max-width);
            margin: auto;

            padding: 23px 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            font-size: 15px;
            font-weight: 600;
        }


        .logo span {
            color: var(--secondary);
            font-weight: 400;
        }


        .back {
            color: var(--secondary);
            font-size: 12px;

            transition: color .2s ease;
        }


        .back:hover {
            color: var(--text);
        }


        /* HERO */

        .hero {
            max-width: var(--max-width);
            margin: auto;

            padding: 115px 30px 90px;
        }


        .label {
            margin-bottom: 25px;

            color: var(--secondary);

            font-size: 11px;
            letter-spacing: .15em;

            text-transform: uppercase;
        }


        h1 {
            max-width: 900px;

            font-size: clamp(55px, 8vw, 100px);

            line-height: .9;

            letter-spacing: -.07em;
        }


        h1 span {
            color: #707070;
        }


        .description {
            max-width: 620px;

            margin-top: 35px;

            color: var(--secondary);

            font-size: 15px;
            line-height: 1.7;
        }


        /* EXERCISES */

        .content {
            max-width: var(--max-width);
            margin: auto;

            padding: 0 30px 130px;
        }


        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;

            padding-bottom: 18px;
            margin-bottom: 14px;

            border-bottom: 1px solid var(--border);
        }


        .section-title {
            font-size: 12px;

            font-weight: 600;

            letter-spacing: .14em;
            text-transform: uppercase;
        }


        .section-count {
            color: var(--secondary);

            font-size: 11px;
        }


        .exercises {
            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 12px;
        }


        .exercise {
            min-height: 330px;

            padding: 30px;

            background: var(--surface);

            border: 1px solid var(--border);

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            transition:
                transform .35s ease,
                background .35s ease,
                border-color .35s ease;
        }


        .exercise.available {
            cursor: pointer;
        }


        .exercise.available:hover {
            transform: translateY(-5px);

            background: var(--surface-hover);

            border-color: var(--border-hover);
        }


        .exercise-number {
            color: var(--secondary);

            font-size: 11px;
            letter-spacing: .12em;
        }


        .exercise-content h2 {
            margin-bottom: 12px;

            font-size: 30px;

            line-height: 1;

            letter-spacing: -.05em;
        }


        .exercise-content p {
            max-width: 440px;

            color: var(--secondary);

            font-size: 13px;
            line-height: 1.6;
        }


        .exercise-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;

            font-size: 11px;
        }


        .exercise-arrow {
            font-size: 18px;

            transition: transform .3s ease;
        }


        .exercise:hover .exercise-arrow {
            transform: translate(5px, -5px);
        }


        /* FOOTER */

        footer {
            border-top: 1px solid var(--border);
        }


        .footer-inner {
            max-width: var(--max-width);
            margin: auto;

            padding: 25px 30px;

            display: flex;
            justify-content: space-between;

            color: var(--secondary);

            font-size: 11px;
        }


        /* MOBILE */

        @media (max-width: 700px) {

            .nav {
                padding: 20px;
            }

            .hero {
                padding: 85px 20px 70px;
            }

            .content {
                padding: 0 20px 80px;
            }

            .exercises {
                grid-template-columns: 1fr;
            }

            .exercise {
                min-height: 290px;
            }

            .footer-inner {
                padding: 20px;

                flex-direction: column;

                gap: 8px;
            }

        }

    </style>

</head>


<body>


    <!-- HEADER -->

    <header>

        <nav class="nav">

            <a href="index.html" class="logo">
                RA<span> / DIWEB</span>
            </a>

            <a href="index.html" class="back">
                ← Volver a temas
            </a>

        </nav>

    </header>



    <!-- HERO -->

    <main>

        <section
